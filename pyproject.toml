[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "0.1.0"
description = "A personal job-search agent that finds UK tech roles with visa sponsorship, tailors your CV, applies, and plans your networking."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "requests>=2.31",
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "reportlab>=4.0",
]

[project.optional-dependencies]
apply = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
include = ["jobagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
