<!doctype html><html><body><form id="f" action="thanks.html" method="get">
<div id="s1">
 <label for="fn">First name *</label><input id="fn" name="fn" required>
 <label for="ln">Last name *</label><input id="ln" name="ln" required>
 <label for="em">Email *</label><input id="em" type="email" name="em" required>
 <label for="ph">Phone</label><input id="ph" type="tel" name="ph">
 <label for="cv">Resume/CV *</label><input id="cv" type="file" name="cv" required>
 <button type="button" onclick="if(document.getElementById('fn').value&&document.getElementById('cv').files.length){document.getElementById('s1').style.display='none';document.getElementById('s2').style.display='block'}">Next</button>
</div>
<div id="s2" style="display:none">
 <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
  <label><input type="radio" name="spons" value="yes" required> Yes</label>
  <label><input type="radio" name="spons" value="no"> No</label></fieldset>
 <label for="why">Why do you want this job? *</label><textarea id="why" name="why" required></textarea>
 <button type="submit">Submit application</button>
</div></form></body></html>
